{% extends "base.html" %}
{% block title %}Reset your password - Alternative{% endblock %}
{% block content %}
    <h1>Reset your password</h1>
    <p>Enter your email address and we'll send you a link to set a new password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <label for="{{ form.email.id_for_label }}">Email</label>
        {{ form.email }}
        <button type="submit">Send link</button>
    </form>
    <p><a href="{% url 'login' %}">Back to sign in</a></p>
{% endblock %}
